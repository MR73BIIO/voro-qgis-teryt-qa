name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    name: Logic of the checks (no QGIS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/test_qa_checks.py -v

  qgis:
    name: Plugin in QGIS ${{ matrix.qgis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis: ["3.40", "3.44", "4.2"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: pytest
        run: python3 -m pytest --version || (apt-get update && apt-get install -y python3-pytest)
      - name: QGIS version
        run: python3 -c "from qgis.core import Qgis; print(Qgis.version())"
      - name: Tests in QGIS
        run: python3 -m pytest tests/qgis -v
